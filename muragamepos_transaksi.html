<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MuragamePOS</title>
<script src="js/components/SidebarKiri.js"></script>
<script src="js/components/MenuSection.js"></script>
<script src="js/components/DetailPesanan.js"></script>
<script src="js/components/PopupPembayaran.js"></script>
<script src="js/components/PopupKustomisasi.js"></script>
<style>
:root {
  --color-background-primary: #ffffff;
  --color-background-secondary: #fcfbf7;
  --color-background-tertiary: #f4f3eb;
  --color-border-tertiary: #e4e2d8;
  --color-border-secondary: #cccccc;
  --color-text-primary: #2c2a29;
  --color-text-secondary: #6b6865;
  --color-text-tertiary: #9e9b97;
  --color-text-info: #d14836; /* Crimson Red */
  --color-border-info: #d14836;
  --color-background-info: #fdf0ed;
  --color-text-success: #2e7d32;
  --color-border-success: #2e7d32;
  --color-background-success: #e8f5e9;
  --color-text-danger: #c62828;
  --color-background-danger: #ffebee;
  --color-text-warning: #ef6c00;
  --color-background-warning: #fff3e0;
  --border-radius-lg: 12px;
  --border-radius-md: 8px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0eee5; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden;}

/* === Custom Element Display Fix === */
/* Web Components default ke display:inline, harus di-override agar CSS grid bekerja */
sidebar-kiri { display:flex; flex-direction:column; grid-row:1/3; }
menu-section { display:block; overflow:hidden; min-height:0; }
detail-pesanan { display:flex; flex-direction:column; grid-row:1/3; }
popup-kustomisasi, popup-pembayaran { display:block; }

.app{display:grid;grid-template-columns:180px 1fr 270px;grid-template-rows:auto 1fr;width:1024px;height:700px;background:var(--color-background-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;border:0.5px solid var(--color-border-tertiary);font-size:13px;color:var(--color-text-primary)}
.sidebar{grid-row:1/3;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;overflow:hidden}
.sb-logo{padding:14px 14px 12px;border-bottom:0.5px solid var(--color-border-tertiary)}
.sb-logo-name{font-size:14px;font-weight:600;color:var(--color-text-info)}
.sb-logo-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.sb-section{font-size:10px;color:var(--color-text-tertiary);padding:10px 14px 3px;letter-spacing:.04em}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;color:var(--color-text-secondary);border-left:2px solid transparent;font-size:12px;transition:all .12s}
.sb-item:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.sb-item.active{color:var(--color-text-info);border-left-color:var(--color-border-info);background:var(--color-background-info);font-weight:500}
.sb-item.danger{color:var(--color-text-danger)}
.sb-item.danger:hover{background:var(--color-background-danger)}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-spacer{flex:1}
.topbar{background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.topbar-left{display:flex;flex-direction:column;gap:1px}
.topbar-title{font-size:13px;font-weight:500}
.topbar-sub{font-size:11px;color:var(--color-text-secondary)}
.topbar-right{display:flex;align-items:center;gap:10px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--color-background-info);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:var(--color-text-info);flex-shrink:0}
.kasir-name{font-size:12px;font-weight:500}
.kasir-shift{font-size:10px;color:var(--color-text-secondary)}
.main{overflow-y:auto;padding:14px;min-height:0;height:100%}
.tabs{display:flex;gap:0;margin-bottom:14px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:3px;width:fit-content}
.tab{padding:5px 14px;font-size:11px;border-radius:6px;cursor:pointer;color:var(--color-text-secondary);transition:all .12s;white-space:nowrap}
.tab.active{background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500;border:0.5px solid var(--color-border-tertiary)}
.sec-label{font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px}
.svc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.svc{padding:8px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;background:var(--color-background-primary);transition:all .12s;text-align:center}
.svc:hover{border-color:var(--color-border-info)}
.svc.sel{border-color:var(--color-border-info);background:var(--color-background-info)}
.svc-name{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.svc-price{font-size:10px;color:var(--color-text-secondary);margin-top:2px}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mc{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px;cursor:pointer;transition:all .12s;position:relative}
.mc:hover{border-color:var(--color-border-info);background:var(--color-background-info)}
.mc.added{border-color:var(--color-border-success);background:var(--color-background-success)}
.mc-name{font-size:12px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px;line-height:1.3}
.mc-cat{font-size:10px;color:var(--color-text-tertiary);margin-bottom:4px}
.mc-price{font-size:13px;font-weight:500;color:var(--color-text-info)}
.tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:10px;margin-top:4px;font-weight:500}
.tag-r{background:var(--color-background-danger);color:var(--color-text-danger)}
.tag-g{background:var(--color-background-warning);color:var(--color-text-warning)}
.tag-s{background:var(--color-background-success);color:var(--color-text-success)}
.cart{background:var(--color-background-primary);border-left:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;grid-row:1/3;overflow:hidden}
.cart-top{padding:12px 14px;border-bottom:0.5px solid var(--color-border-tertiary)}
.cart-title{font-size:13px;font-weight:500;margin-bottom:10px}
.cust-row{display:flex;align-items:center;gap:8px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:7px 10px}
.cust-av{width:26px;height:26px;border-radius:50%;background:var(--color-background-success);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:var(--color-text-success);flex-shrink:0}
.cust-name{font-size:12px;font-weight:500}
.cust-type{font-size:10px;color:var(--color-text-success)}
.cart-items{flex:1;overflow-y:auto;padding:8px 14px;min-height:0}
.ci{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.ci:last-child{border-bottom:none}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-detail{font-size:10px;color:var(--color-text-tertiary);margin-top:1px}
.qty{display:flex;align-items:center;gap:4px;flex-shrink:0}
.qb{width:18px;height:18px;border:0.5px solid var(--color-border-secondary);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--color-text-secondary);background:var(--color-background-secondary);user-select:none;line-height:1}
.qb:hover{background:var(--color-background-tertiary)}
.qn{font-size:12px;font-weight:500;min-width:16px;text-align:center}
.ci-price{font-size:12px;font-weight:500;flex-shrink:0}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--color-text-tertiary)}
.cart-empty svg{opacity:.3}
.cart-footer{padding:12px 14px;border-top:0.5px solid var(--color-border-tertiary);flex-shrink:0}
.calc{display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.calc.disc{color:var(--color-text-success)}
.calc.total{font-size:13px;font-weight:600;color:var(--color-text-primary);margin-top:8px;padding-top:8px;border-top:0.5px solid var(--color-border-tertiary)}
.pay-btn{width:100%;margin-top:10px;height:40px;background:var(--color-text-info);color:#fff;border:none;border-radius:var(--border-radius-md);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .12s}
.pay-btn:hover{opacity:.88}
.pay-btn:disabled{opacity:.4;cursor:not-allowed}
.badge-count{position:absolute;top:8px;right:8px;background:var(--color-text-info);color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500}

/* Modal Styling */
.modal {
  display: none; 
  position: fixed; 
  z-index: 9999; 
  left: 0; 
  top: 0; 
  width: 100%; 
  height: 100%; 
  overflow: auto; 
  background-color: rgba(0,0,0,0.45); 
  backdrop-filter: blur(4px);
  align-items: center; 
  justify-content: center;
}
.modal-content {
  background-color: var(--color-background-primary); 
  border: 0.5px solid var(--color-border-tertiary); 
  padding: 22px; 
  border-radius: var(--border-radius-lg); 
  width: 380px; 
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  color: var(--color-text-primary);
  animation: modalFadeIn 0.15s ease-out;
}
@keyframes modalFadeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.pay-opt {
  padding: 10px; 
  border: 0.5px solid var(--color-border-tertiary); 
  border-radius: var(--border-radius-md); 
  cursor: pointer; 
  text-align: center;
  transition: all 0.12s;
  background: var(--color-background-secondary);
}
.pay-opt:hover {
  border-color: var(--color-border-info);
  background: var(--color-background-primary);
}
.pay-opt.sel {
  border-color: var(--color-border-info);
  background: var(--color-background-info);
  color: var(--color-text-info);
  font-weight: 500;
}
.quick-cash-btn {
  font-size: 11px; 
  padding: 6px; 
  border: 0.5px solid var(--color-border-tertiary); 
  background: var(--color-background-secondary); 
  cursor: pointer; 
  border-radius: 4px;
  color: var(--color-text-secondary);
  transition: all 0.1s;
}
.quick-cash-btn:hover {
  background: var(--color-background-tertiary);
  color: var(--color-text-primary);
}
.quick-cash-btn.active-pedas {
  background: var(--color-text-info) !important;
  color: #fff !important;
  border-color: var(--color-text-info) !important;
}
.receipt-content {
  background-color: #ffffff; 
  color: #1a1a1a; 
  padding: 24px; 
  border-radius: 8px; 
  width: 340px; 
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25); 
  font-family: 'Courier New', Courier, monospace;
  animation: modalFadeIn 0.15s ease-out;
}

/* Close button styling */
.close-btn {
  cursor: pointer;
  font-size: 20px;
  color: var(--color-text-secondary);
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  transition: all 0.12s;
  flex-shrink: 0;
}
.close-btn:hover {
  background: var(--color-background-tertiary);
  color: var(--color-text-primary);
}

/* History table */
.history-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  text-align: left;
}
.history-table th {
  padding: 10px 14px;
  font-weight: 500;
  background: var(--color-background-secondary);
  border-bottom: 0.5px solid var(--color-border-tertiary);
  color: var(--color-text-secondary);
}
.history-table td {
  padding: 10px 14px;
  border-bottom: 0.5px solid var(--color-border-tertiary);
}
</style>
</head>
<body>

<div class="app">

  <sidebar-kiri></sidebar-kiri>

  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">Transaksi Baru</div>
      <div class="topbar-sub" id="orderId">ORD-XXXXXXXX-XXX</div>
    </div>
    <div class="topbar-right">
      <div class="avatar">AK</div>
      <div>
        <div class="kasir-name">Ahmad Kasir</div>
        <div class="kasir-shift" id="shiftLabel">Shift Pagi</div>
      </div>
    </div>
  </div>

  <menu-section></menu-section>

  <detail-pesanan></detail-pesanan>

</div>

<popup-kustomisasi></popup-kustomisasi>
<popup-pembayaran></popup-pembayaran>

<script>
var menus = [];
var cart = {};
var activeFilter = 'semua';
var activePayMethod = 'CASH';
var currentTotalValue = 0;
var activeView = 'transaksi';

var selectedKuahVal = 'Shoyu';
var selectedPedasVal = 0;
var pastTransactionsList = [];

// Mock system variables
var mockCart = [];
var mockSvcName = "Dine In";
var mockSvcPrice = 5000;
var mockCustomerName = "Budi Santoso";
var mockCustomerType = "Member · diskon 10%";
var mockDiscountRate = 0.10;
var mockHistory = [];

var isInitialized = false;

function fmt(n){
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}

// Java integration loader / Mock initializer
function initApp() {
  if (isInitialized) return;
  isInitialized = true;
  
  if (window.javaApp) {
    try {
      // 1. Fetch menus from Java
      var menusRaw = window.javaApp.getMenusJson();
      menus = JSON.parse(menusRaw);
      
      // 2. Fetch shift & date info
      var h = new Date().getHours();
      var s = h>=6&&h<14?'Shift Pagi':h>=14&&h<21?'Shift Siang':'Shift Malam';
      document.getElementById('shiftLabel').textContent = s;
      document.getElementById('orderId').textContent = window.javaApp.getOrderId();
      
      // 3. Sync and render
      syncWithJava();
    } catch(err) {
      console.error("Java integration error: ", err);
    }
  } else {
    console.warn("window.javaApp is not injected yet! Loading mock data for development testing.");
    // Populate mock menus matching JavaBridge.java
    menus = [
      {"id":"M001","name":"Shio Tori Ramen","cat":"ramen","price":38000,"tag":"Shio","tagClass":"tag-s","detail":"Chashu · Tamago · Nori"},
      {"id":"M002","name":"Shoyu Tori Ramen","cat":"ramen","price":38000,"tag":"Shoyu","tagClass":"tag-s","detail":"Chashu · Tamago · Nori"},
      {"id":"M003","name":"Miso Tori Ramen","cat":"ramen","price":38000,"tag":"Miso","tagClass":"tag-g","detail":"Chashu · Tamago · Nori"},
      {"id":"M004","name":"Paitan Tori Ramen","cat":"ramen","price":38000,"tag":"Paitan","tagClass":"tag-r","detail":"Chashu · Tamago · Nori"},
      {"id":"M005","name":"Shio Beef Ramen","cat":"ramen","price":45000,"tag":"Shio","tagClass":"tag-s","detail":"Beef Slices · Tamago · Nori"},
      {"id":"M006","name":"Shoyu Beef Ramen","cat":"ramen","price":45000,"tag":"Shoyu","tagClass":"tag-s","detail":"Beef Slices · Tamago · Nori"},
      {"id":"M007","name":"Miso Beef Ramen","cat":"ramen","price":45000,"tag":"Miso","tagClass":"tag-g","detail":"Beef Slices · Tamago · Nori"},
      {"id":"M008","name":"Paitan Beef Ramen","cat":"ramen","price":45000,"tag":"Paitan","tagClass":"tag-r","detail":"Beef Slices · Tamago · Nori"},
      {"id":"M009","name":"Shio Tempura Ramen","cat":"ramen","price":42000,"tag":"Shio","tagClass":"tag-s","detail":"Tempura · Tamago · Nori"},
      {"id":"M010","name":"Shoyu Tempura Ramen","cat":"ramen","price":42000,"tag":"Shoyu","tagClass":"tag-s","detail":"Tempura · Tamago · Nori"},
      {"id":"M011","name":"Miso Tempura Ramen","cat":"ramen","price":42000,"tag":"Miso","tagClass":"tag-g","detail":"Tempura · Tamago · Nori"},
      {"id":"M012","name":"Paitan Tempura Ramen","cat":"ramen","price":42000,"tag":"Paitan","tagClass":"tag-r","detail":"Tempura · Tamago · Nori"},
      {"id":"M013","name":"Es Matcha Latte","cat":"minuman","price":22000,"tag":"Dingin","tagClass":"tag-g","detail":"Less sugar available"},
      {"id":"M014","name":"Es Teh Tarik","cat":"minuman","price":15000,"tag":"Dingin","tagClass":"tag-g","detail":"Creamy blend"},
      {"id":"M015","name":"Gyoza (6 pcs)","cat":"snack","price":28000,"tag":"Goreng","tagClass":"tag-s","detail":"Pork Filling"},
      {"id":"M016","name":"Karaage","cat":"snack","price":25000,"tag":"Crispy","tagClass":"tag-s","detail":"Chicken · Mayo sauce"},
      {"id":"M017","name":"Takoyaki (6)","cat":"snack","price":23000,"tag":"Hangat","tagClass":"tag-s","detail":"Octopus · Bonito"}
    ];
    var h = new Date().getHours();
    var s = h>=6&&h<14?'Shift Pagi':h>=14&&h<21?'Shift Siang':'Shift Malam';
    document.getElementById('shiftLabel').textContent = s;
    document.getElementById('orderId').textContent = "ORD-MOCK-100";
    
    syncMockCart();
  }
}

// Dom load event fallback
window.addEventListener('DOMContentLoaded', function() {
  setTimeout(initApp, 100);
});

function renderMenus(){
  var g = document.getElementById('menuGrid');
  if (!g) return;
  g.innerHTML = '';
  var filtered = activeFilter === 'semua' ? menus : menus.filter(function(m){return m.cat === activeFilter});
  filtered.forEach(function(m){
    var qtyCount = 0;
    Object.keys(cart).forEach(function(invoiceId) {
      if (cart[invoiceId].menu.id === m.id) {
        qtyCount += cart[invoiceId].qty;
      }
    });

    var inCart = qtyCount > 0;
    var d = document.createElement('div');
    d.className = 'mc' + (inCart ? ' added' : '');
    
    var badge = inCart ? '<div class="badge-count">' + qtyCount + '</div>' : '';
    d.innerHTML = '<div class="mc-name">' + m.name + '</div>' + 
                  '<div class="mc-cat">' + m.cat.charAt(0).toUpperCase() + m.cat.slice(1) + '</div>' + 
                  '<div class="mc-price">' + fmt(m.price) + '</div>' + 
                  '<span class="tag ' + m.tagClass + '">' + m.tag + '</span>' + 
                  badge;
    d.onclick = function(){ addItem(m) };
    g.appendChild(d);
  });
}

function syncWithJava() {
  if (!window.javaApp) {
    syncMockCart();
    return;
  }
  
  var summaryRaw = window.javaApp.getOrderSummaryJson();
  var summary = JSON.parse(summaryRaw);
  
  document.getElementById('orderId').textContent = window.javaApp.getOrderId();
  
  cart = {};
  summary.items.forEach(function(item) {
    cart[item.invoiceId] = {
      menu: { id: item.menuId, name: item.name, price: item.price },
      qty: item.qty
    };
  });
  
  renderMenus();
  
  var wrap = document.getElementById('cartItems');
  if (summary.items.length === 0) {
    wrap.innerHTML = '<div class="cart-empty" id="cartEmpty">' + 
                     '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>' + 
                     '<span style="font-size:12px">Belum ada item</span>' + 
                     '</div>';
    document.getElementById('payBtn').disabled = true;
  } else {
    wrap.innerHTML = '';
    summary.items.forEach(function(item) {
      var d = document.createElement('div');
      d.className = 'ci';
      d.innerHTML = '<div class="ci-info">' + 
                      '<div class="ci-name">' + item.name + '</div>' + 
                      '<div class="ci-detail">' + item.detail + '</div>' + 
                    '</div>' + 
                    '<div class="qty">' + 
                      '<div class="qb" onclick="changeQty(\'' + item.invoiceId + '\', -1)">−</div>' + 
                      '<div class="qn">' + item.qty + '</div>' + 
                      '<div class="qb" onclick="changeQty(\'' + item.invoiceId + '\', 1)">+</div>' + 
                    '</div>' + 
                    '<div class="ci-price">' + fmt(item.lineTotal) + '</div>';
      wrap.appendChild(d);
    });
    document.getElementById('payBtn').disabled = false;
  }
  
  document.getElementById('fSubtotal').textContent = fmt(summary.subtotal);
  document.getElementById('fSvcLabel').textContent = 'Layanan (' + summary.svcName + ')';
  document.getElementById('fSvc').textContent = fmt(summary.svcPrice);
  document.getElementById('fDisc').textContent = '– ' + fmt(summary.discount);
  document.getElementById('fTotal').textContent = fmt(summary.total);
  
  currentTotalValue = summary.total;
  
  if (activeView === 'riwayat') {
    renderHistory();
  }
}

function syncMockCart() {
  var subtotal = 0;
  mockCart.forEach(function(item) {
    subtotal += item.price * item.qty;
  });
  
  var discount = subtotal * mockDiscountRate;
  var total = subtotal > 0 ? (subtotal + mockSvcPrice - discount) : 0;
  if (subtotal <= 0) {
    discount = 0;
  }
  
  document.getElementById('orderId').textContent = "ORD-MOCK-" + (mockHistory.length + 100);
  
  cart = {};
  mockCart.forEach(function(item) {
    cart[item.invoiceId] = {
      menu: { id: item.menuId, name: item.name, price: item.price },
      qty: item.qty
    };
  });
  
  renderMenus();
  
  var wrap = document.getElementById('cartItems');
  if (mockCart.length === 0) {
    wrap.innerHTML = '<div class="cart-empty" id="cartEmpty">' + 
                     '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>' + 
                     '<span style="font-size:12px">Belum ada item</span>' + 
                     '</div>';
    document.getElementById('payBtn').disabled = true;
  } else {
    wrap.innerHTML = '';
    mockCart.forEach(function(item) {
      var d = document.createElement('div');
      d.className = 'ci';
      d.innerHTML = '<div class="ci-info">' + 
                      '<div class="ci-name">' + item.name + '</div>' + 
                      '<div class="ci-detail">' + item.detail + '</div>' + 
                    '</div>' + 
                    '<div class="qty">' + 
                      '<div class="qb" onclick="changeQty(\'' + item.invoiceId + '\', -1)">−</div>' + 
                      '<div class="qn">' + item.qty + '</div>' + 
                      '<div class="qb" onclick="changeQty(\'' + item.invoiceId + '\', 1)">+</div>' + 
                    '</div>' + 
                    '<div class="ci-price">' + fmt(item.lineTotal) + '</div>';
      wrap.appendChild(d);
    });
    document.getElementById('payBtn').disabled = false;
  }
  
  document.getElementById('fSubtotal').textContent = fmt(subtotal);
  document.getElementById('fSvcLabel').textContent = 'Layanan (' + mockSvcName + ')';
  document.getElementById('fSvc').textContent = fmt(mockSvcPrice);
  document.getElementById('fDisc').textContent = '– ' + fmt(discount);
  document.getElementById('fTotal').textContent = fmt(total);
  
  currentTotalValue = total;
  
  if (activeView === 'riwayat') {
    renderHistory();
  }
}

function addItem(m) {
  if (m.cat === 'ramen') {
    openCustomizationModal(m);
  } else {
    if (window.javaApp) {
      window.javaApp.addItem(m.id);
      syncWithJava();
    } else {
      var found = false;
      for (var i = 0; i < mockCart.length; i++) {
        if (mockCart[i].menuId === m.id && mockCart[i].detail === (m.detail || "")) {
          mockCart[i].qty++;
          mockCart[i].lineTotal = mockCart[i].qty * mockCart[i].price;
          found = true;
          break;
        }
      }
      if (!found) {
        var invoiceId = "INV-MOCK-" + Date.now() + "-" + Math.floor(Math.random()*1000);
        mockCart.push({
          invoiceId: invoiceId,
          menuId: m.id,
          name: m.name,
          price: m.price,
          qty: 1,
          lineTotal: m.price,
          detail: m.detail || ""
        });
      }
      syncMockCart();
    }
  }
}

function changeQty(invoiceId, delta) {
  if (window.javaApp) {
    window.javaApp.changeQty(invoiceId, delta);
    syncWithJava();
  } else {
    for (var i = 0; i < mockCart.length; i++) {
      if (mockCart[i].invoiceId === invoiceId) {
        mockCart[i].qty += delta;
        mockCart[i].lineTotal = mockCart[i].qty * mockCart[i].price;
        if (mockCart[i].qty <= 0) {
          mockCart.splice(i, 1);
        }
        break;
      }
    }
    syncMockCart();
  }
}

function selectSvc(el, name) {
  document.querySelectorAll('.svc').forEach(function(s){s.classList.remove('sel')});
  el.classList.add('sel');
  if (window.javaApp) {
    window.javaApp.selectSvc(name);
    syncWithJava();
  } else {
    mockSvcName = name;
    if (name === 'Take Away') mockSvcPrice = 2000;
    else if (name === 'Delivery') mockSvcPrice = 15000;
    else mockSvcPrice = 5000;
    syncMockCart();
  }
}

function filterMenu(cat, el) {
  activeFilter = cat;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  renderMenus();
}

function switchView(view) {
  var menuSectionEl = document.querySelector('menu-section');
  var detailPesananEl = document.querySelector('detail-pesanan');
  
  if (view === 'transaksi') {
    activeView = 'transaksi';
    document.getElementById('sbTransaksi').classList.add('active');
    document.getElementById('sbRiwayat').classList.remove('active');
    document.getElementById('sbTransaksi').querySelector('.sb-dot').style.backgroundColor = 'var(--color-text-info)';
    document.getElementById('sbRiwayat').querySelector('.sb-dot').style.backgroundColor = 'var(--color-border-secondary)';
    
    if (menuSectionEl) {
      menuSectionEl.style.gridColumn = '2';
      var menuView = menuSectionEl.querySelector('#menuViewSection');
      if (menuView) menuView.style.display = 'block';
      var histView = menuSectionEl.querySelector('#historyView');
      if (histView) histView.style.display = 'none';
    }
    if (detailPesananEl) {
      detailPesananEl.style.display = 'flex';
    }
  } else if (view === 'riwayat') {
    activeView = 'riwayat';
    document.getElementById('sbTransaksi').classList.remove('active');
    document.getElementById('sbRiwayat').classList.add('active');
    document.getElementById('sbTransaksi').querySelector('.sb-dot').style.backgroundColor = 'var(--color-border-secondary)';
    document.getElementById('sbRiwayat').querySelector('.sb-dot').style.backgroundColor = 'var(--color-text-info)';
    
    if (menuSectionEl) {
      menuSectionEl.style.gridColumn = '2 / 4';
      var menuView = menuSectionEl.querySelector('#menuViewSection');
      if (menuView) menuView.style.display = 'none';
      var histView = menuSectionEl.querySelector('#historyView');
      if (histView) histView.style.display = 'block';
    }
    if (detailPesananEl) {
      detailPesananEl.style.display = 'none';
    }
    
    renderHistory();
  }
}

function openCustomizationModal(m) {
  document.getElementById('custMenuId').value = m.id;
  document.getElementById('custModalTitle').textContent = 'Kustomisasi ' + m.name;
  
  selectedKuahVal = 'Shoyu';
  selectedPedasVal = 0;
  
  var kuahOpts = document.querySelectorAll('.kuah-opt');
  if (kuahOpts.length > 0) {
    kuahOpts.forEach(function(el) {
      el.classList.remove('sel');
    });
    kuahOpts[0].classList.add('sel');
  }
  
  selectPedas(0);
  
  var cbs = document.querySelectorAll('.topping-cb');
  cbs.forEach(function(cb) {
    if (cb.value === 'Chashu' || cb.value === 'Tamago' || cb.value === 'Nori') {
      cb.checked = true;
    } else {
      cb.checked = false;
    }
  });
  
  document.getElementById('custNotes').value = '';
  document.getElementById('customizationModal').style.display = 'flex';
}

function closeCustomizationModal() {
  document.getElementById('customizationModal').style.display = 'none';
}

function selectKuah(el, kuah) {
  document.querySelectorAll('.kuah-opt').forEach(function(o){o.classList.remove('sel')});
  el.classList.add('sel');
  selectedKuahVal = kuah;
}

function selectPedas(level) {
  selectedPedasVal = level;
  document.querySelectorAll('.pedas-btn').forEach(function(btn, i) {
    if (i === level) {
      btn.classList.add('active-pedas');
    } else {
      btn.classList.remove('active-pedas');
    }
  });
}

function confirmCustomization() {
  var menuId = document.getElementById('custMenuId').value;
  var menuObj = menus.find(function(m){return m.id === menuId});
  if (!menuObj) return;
  
  var toppings = [];
  document.querySelectorAll('.topping-cb').forEach(function(cb) {
    if (cb.checked) toppings.push(cb.value);
  });
  var toppingStr = toppings.join(', ');
  
  var notes = document.getElementById('custNotes').value;
  
  if (window.javaApp) {
    window.javaApp.addRamenWithCustomization(menuId, selectedPedasVal, toppingStr, notes);
    closeCustomizationModal();
    syncWithJava();
  } else {
    var kuah = "Original";
    var nameLower = menuObj.name.toLowerCase();
    if (nameLower.indexOf("shio") !== -1) kuah = "Shio";
    else if (nameLower.indexOf("shoyu") !== -1) kuah = "Shoyu";
    else if (nameLower.indexOf("miso") !== -1) kuah = "Miso";
    else if (nameLower.indexOf("paitan") !== -1) kuah = "Paitan";
    
    var detailParts = ["Kuah: " + kuah, "Pedas " + selectedPedasVal];
    if (toppingStr.trim() !== "") detailParts.push("Topping: " + toppingStr);
    if (notes.trim() !== "") detailParts.push("(" + notes + ")");
    var detailStr = detailParts.join(" · ");
    
    var found = false;
    for (var i = 0; i < mockCart.length; i++) {
      if (mockCart[i].menuId === menuId && mockCart[i].detail === detailStr) {
        mockCart[i].qty++;
        mockCart[i].lineTotal = mockCart[i].qty * mockCart[i].price;
        found = true;
        break;
      }
    }
    if (!found) {
      var invoiceId = "INV-MOCK-" + Date.now() + "-" + Math.floor(Math.random()*1000);
      mockCart.push({
        invoiceId: invoiceId,
        menuId: menuId,
        name: menuObj.name,
        price: menuObj.price,
        qty: 1,
        lineTotal: menuObj.price,
        detail: detailStr
      });
    }
    closeCustomizationModal();
    syncMockCart();
  }
}

function goPayment() {
  document.getElementById('modalTotal').textContent = fmt(currentTotalValue);
  document.getElementById('cashAmount').value = '';
  document.getElementById('cashChange').textContent = 'Rp 0';
  document.getElementById('confirmPayBtn').disabled = activePayMethod === 'CASH';
  
  selectPayMethod('CASH');
  
  document.getElementById('paymentModal').style.display = 'flex';
}

function closePaymentModal() {
  document.getElementById('paymentModal').style.display = 'none';
}

function selectPayMethod(method) {
  activePayMethod = method;
  document.querySelectorAll('.pay-opt').forEach(function(o){o.classList.remove('sel')});
  
  if (method === 'CASH') {
    document.getElementById('btnPayCash').classList.add('sel');
    document.getElementById('cashSection').style.display = 'block';
    document.getElementById('qrisSection').style.display = 'none';
    calcChange();
  } else {
    document.getElementById('btnPayQris').classList.add('sel');
    document.getElementById('cashSection').style.display = 'none';
    document.getElementById('qrisSection').style.display = 'block';
    document.getElementById('confirmPayBtn').disabled = false;
  }
}

function setQuickCash(val) {
  var cashInput = document.getElementById('cashAmount');
  if (val === 'pas') {
    cashInput.value = currentTotalValue;
  } else {
    cashInput.value = val;
  }
  calcChange();
}

function calcChange() {
  if (activePayMethod !== 'CASH') return;
  
  var cashReceived = parseFloat(document.getElementById('cashAmount').value) || 0;
  var change = cashReceived - currentTotalValue;
  
  var changeEl = document.getElementById('cashChange');
  if (change < 0) {
    changeEl.textContent = 'Kurang ' + fmt(Math.abs(change));
    changeEl.style.color = 'var(--color-text-danger)';
    document.getElementById('confirmPayBtn').disabled = true;
  } else {
    changeEl.textContent = fmt(change);
    changeEl.style.color = 'var(--color-text-success)';
    document.getElementById('confirmPayBtn').disabled = false;
  }
}

function confirmPayment() {
  var cashReceived = 0;
  if (activePayMethod === 'CASH') {
    cashReceived = parseFloat(document.getElementById('cashAmount').value) || 0;
    if (cashReceived < currentTotalValue) {
      alert("Uang yang diterima kurang!");
      return;
    }
  }
  
  if (window.javaApp) {
    var responseRaw = window.javaApp.processPayment(activePayMethod, cashReceived);
    var response = JSON.parse(responseRaw);
    
    if (response.success) {
      closePaymentModal();
      showReceipt(response);
      syncWithJava();
    } else {
      alert(response.message || "Pembayaran gagal!");
    }
  } else {
    var subtotal = 0;
    mockCart.forEach(function(item) {
      subtotal += item.price * item.qty;
    });
    var discount = subtotal * mockDiscountRate;
    var total = subtotal > 0 ? (subtotal + mockSvcPrice - discount) : 0;
    if (subtotal <= 0) discount = 0;
    
    var change = activePayMethod === 'CASH' ? (cashReceived - total) : 0;
    
    var dateStr = new Date().toISOString().replace('T', ' ').substring(0, 19);
    var orderId = "ORD-MOCK-" + (mockHistory.length + 101);
    
    var txItems = [];
    mockCart.forEach(function(item) {
      txItems.push({
        name: item.name,
        qty: item.qty,
        total: item.lineTotal
      });
    });
    
    var response = {
      success: true,
      orderId: orderId,
      date: dateStr,
      customerName: mockCustomerName,
      subtotal: subtotal,
      service: mockSvcPrice,
      discount: discount,
      total: total,
      method: activePayMethod,
      paid: activePayMethod === 'CASH' ? cashReceived : total,
      change: change,
      items: txItems
    };
    
    mockHistory.push({
      orderId: orderId,
      date: dateStr,
      customerName: mockCustomerName,
      subtotal: subtotal,
      service: mockSvcPrice,
      serviceName: mockSvcName,
      discount: discount,
      total: total,
      method: activePayMethod,
      paid: activePayMethod === 'CASH' ? cashReceived : total,
      change: change,
      items: txItems
    });
    
    mockCart = [];
    closePaymentModal();
    showReceipt(response);
    syncMockCart();
  }
}

function showReceipt(data) {
  document.getElementById('rOrderId').textContent = data.orderId;
  document.getElementById('rDate').textContent = data.date;
  document.getElementById('rCustomer').textContent = data.customerName;
  document.getElementById('rSubtotal').textContent = fmt(data.subtotal);
  document.getElementById('rSvc').textContent = fmt(data.service);
  document.getElementById('rDisc').textContent = '– ' + fmt(data.discount);
  document.getElementById('rTotal').textContent = fmt(data.total);
  document.getElementById('rMethod').textContent = data.method;
  document.getElementById('rPaid').textContent = fmt(data.paid);
  document.getElementById('rChange').textContent = fmt(data.change);
  
  var itemsWrap = document.getElementById('rItems');
  itemsWrap.innerHTML = '';
  data.items.forEach(function(item) {
    var line = document.createElement('div');
    line.style.display = 'flex';
    line.style.justifyContent = 'space-between';
    line.innerHTML = '<span>' + item.name + ' x' + item.qty + '</span>' + 
                     '<span>' + fmt(item.total) + '</span>';
    itemsWrap.appendChild(line);
  });
  
  document.getElementById('receiptModal').style.display = 'flex';
}

function closeReceiptModal() {
  document.getElementById('receiptModal').style.display = 'none';
}

function renderHistory() {
  if (window.javaApp) {
    var historyRaw = window.javaApp.getHistoryJson();
    var history = JSON.parse(historyRaw);
    pastTransactionsList = history;
  } else {
    pastTransactionsList = mockHistory;
  }
  
  document.getElementById('historyCount').textContent = pastTransactionsList.length + ' Transaksi';
  
  var tbody = document.getElementById('historyTableBody');
  tbody.innerHTML = '';
  
  if (pastTransactionsList.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="padding:20px; text-align:center; color:var(--color-text-tertiary);">Belum ada riwayat transaksi hari ini</td></tr>';
    return;
  }
  
  pastTransactionsList.forEach(function(tx, index) {
    var timeOnly = tx.date.split(' ')[1] || tx.date;
    var tr = document.createElement('tr');
    tr.innerHTML = '<td style="padding:10px 14px; font-weight:500;">' + tx.orderId + '</td>' +
                   '<td style="padding:10px 14px; color:var(--color-text-secondary);">' + timeOnly + '</td>' +
                   '<td style="padding:10px 14px;">' + tx.customerName + '</td>' +
                   '<td style="padding:10px 14px; color:var(--color-text-secondary);">' + tx.serviceName + '</td>' +
                   '<td style="padding:10px 14px; font-weight:600; color:var(--color-text-info);">' + fmt(tx.total) + '</td>' +
                   '<td style="padding:10px 14px; text-align:right;">' +
                     '<button class="quick-cash-btn" onclick="reprintStruk(' + index + ')" style="padding:4px 8px;">Lihat Struk</button>' +
                   '</td>';
    tbody.appendChild(tr);
  });
}

function reprintStruk(index) {
  var tx = pastTransactionsList[index];
  if (!tx) return;
  
  var data = {
    orderId: tx.orderId,
    date: tx.date,
    customerName: tx.customerName,
    subtotal: tx.subtotal,
    service: tx.service,
    discount: tx.discount,
    total: tx.total,
    method: tx.method || 'CASH',
    paid: tx.paid || tx.total,
    change: tx.change || 0,
    items: tx.items
  };
  
  showReceipt(data);
}

function logout() {
  if (window.javaApp) {
    window.javaApp.exitApp();
  } else {
    window.close();
  }
}

// === Click-outside-to-close untuk semua modal ===
document.addEventListener('click', function(e) {
  // Kustomisasi modal
  var custModal = document.getElementById('customizationModal');
  if (custModal && custModal.style.display === 'flex' && e.target === custModal) {
    closeCustomizationModal();
  }
  // Payment modal
  var payModal = document.getElementById('paymentModal');
  if (payModal && payModal.style.display === 'flex' && e.target === payModal) {
    closePaymentModal();
  }
  // Receipt modal
  var rcptModal = document.getElementById('receiptModal');
  if (rcptModal && rcptModal.style.display === 'flex' && e.target === rcptModal) {
    closeReceiptModal();
  }
});

// === ESC key untuk tutup modal ===
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    var custModal = document.getElementById('customizationModal');
    if (custModal && custModal.style.display === 'flex') {
      closeCustomizationModal();
      return;
    }
    var payModal = document.getElementById('paymentModal');
    if (payModal && payModal.style.display === 'flex') {
      closePaymentModal();
      return;
    }
    var rcptModal = document.getElementById('receiptModal');
    if (rcptModal && rcptModal.style.display === 'flex') {
      closeReceiptModal();
      return;
    }
  }
});
</script>
</body>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MuragamePOS</title>
<!-- Web Components -->
<script src="js/components/SidebarKiri.js?v=1"></script>
<script src="js/components/MenuSection.js?v=1"></script>
<script src="js/components/DetailPesanan.js?v=1"></script>
<script src="js/components/PopupPembayaran.js?v=1"></script>
<script src="js/components/PopupKustomisasi.js?v=1"></script>

<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

<div class="app">
  <sidebar-kiri></sidebar-kiri>

  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">Transaksi Baru</div>
      <div class="topbar-sub" id="orderId">ORD-XXXXXXXX-XXX</div>
    </div>
    <div class="topbar-right">
      <div class="avatar">AK</div>
      <div>
        <div class="kasir-name">Ahmad Kasir</div>
        <div class="kasir-shift" id="shiftLabel">Shift Pagi</div>
      </div>
    </div>
  </div>

  <menu-section id="menuSectionEl"></menu-section>

  <detail-pesanan id="detailPesananEl"></detail-pesanan>
</div>

<!-- MODAL KELOLA MENU -->
<div id="menuModal" class="modal" style="display:none;">
  <div class="modal-content" style="width: 360px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:0.5px solid var(--color-border-tertiary); padding-bottom:10px;">
      <h3 id="menuModalTitle" style="font-size:13px; font-weight:600;">Tambah Menu Baru</h3>
      <span class="close-btn" onclick="closeMenuModal()" style="cursor:pointer; font-size:18px; color:var(--color-text-secondary);">&times;</span>
    </div>
    <input type="hidden" id="menuActionType" value="add">
    <div style="margin-bottom:12px;">
      <label style="display:block; font-size:11px; color:var(--color-text-secondary); margin-bottom:4px;">ID Menu</label>
      <input type="text" id="menuIdInput" placeholder="Contoh: M018" style="width:100%; padding:8px 10px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); background:var(--color-background-secondary); color:var(--color-text-primary); font-size:12px;">
    </div>
    <div style="margin-bottom:12px;">
      <label style="display:block; font-size:11px; color:var(--color-text-secondary); margin-bottom:4px;">Nama Menu</label>
      <input type="text" id="menuNameInput" placeholder="Contoh: Spicy Ramen" style="width:100%; padding:8px 10px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); background:var(--color-background-secondary); color:var(--color-text-primary); font-size:12px;">
    </div>
    <div style="margin-bottom:12px;">
      <label style="display:block; font-size:11px; color:var(--color-text-secondary); margin-bottom:4px;">Kategori</label>
      <select id="menuCatInput" style="width:100%; padding:8px 10px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); background:var(--color-background-secondary); color:var(--color-text-primary); font-size:12px;">
        <option value="ramen">Ramen</option>
        <option value="minuman">Minuman</option>
        <option value="snack">Snack</option>
      </select>
    </div>
    <div style="margin-bottom:15px;">
      <label style="display:block; font-size:11px; color:var(--color-text-secondary); margin-bottom:4px;">Harga (Rp)</label>
      <input type="number" id="menuPriceInput" placeholder="Contoh: 35000" style="width:100%; padding:8px 10px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); background:var(--color-background-secondary); color:var(--color-text-primary); font-size:12px;">
    </div>
    <button class="pay-btn" style="margin-top:5px;" onclick="saveMenu()">Simpan Menu</button>
  </div>
</div>

<popup-kustomisasi></popup-kustomisasi>
<popup-pembayaran></popup-pembayaran>

<script src="js/app.js?v=1"></script>
</body>
</html>
